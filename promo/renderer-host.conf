# espface.manzari.dev was the renderer host until 2026-11-20; the renderer, /connect/ and /flash/ now live on
# r.espface.manzari.dev (the docs are served here, docs.conf). Firmware 1.0.0 loads
# https://espface.manzari.dev/r/1/app.js literally, so /r/ must keep answering here for as long as such devices
# exist (web/RENDERER-VERSIONING.md, rule 3).
set $renderer_host https://r.espface.manzari.dev;

# ^~ keeps these paths away from the engine's static-asset regex location.
location ^~ /r/ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cross-Origin-Resource-Policy "cross-origin";
    add_header Cache-Control "public, max-age=86400";
    return 301 $renderer_host$request_uri;
}

location ^~ /connect/ { return 301 $renderer_host$request_uri; }
location ^~ /flash/   { return 301 $renderer_host$request_uri; }
location = /connect   { return 301 $renderer_host/connect/$is_args$args; }
location = /flash     { return 301 $renderer_host/flash/; }

# Links from before /connect/ existed: /?host=<device>.
location = / {
    if ($arg_host) { return 302 $renderer_host/connect/$is_args$args; }
}
