hero:
  title: "A native control panel for your ESP32."
  subtitle: "Describe gauges, charts, switches and sliders in a few lines of Arduino code. The espFace app draws them as a native screen and talks straight to the device over WiFi, Bluetooth or USB."
  screenshot_1:
    icon: "fas fa-gauge-high"
    label: "A boiler controller in the app: temperature gauge, history chart, tank level and pressure"
    image: "/assets/images/phone-device-dark.jpg"
  screenshot_2:
    icon: "fas fa-microchip"
    label: "The list of devices, grouped by project"
    image: "/assets/images/phone-devices-dark.jpg"
  web_screenshot:
    icon: "fas fa-desktop"
    label: "The same boiler controller in a desktop browser"
    image: "/assets/images/web-device-light.jpg"

features:
  tag: "Features"
  title: "The firmware is the app"
  subtitle: "The device describes its own screen. There is no app to write, no HTML to serve by hand and no layout to maintain."
  items:
    - icon: "fas fa-code"
      title: "A few lines of code"
      description: "A sketch declares its widgets with the espFace Arduino library and gets callbacks when a value changes. Everything else, from the layout to the live updates, is handled for you."
    - icon: "fas fa-gauge-high"
      title: "30 widget types"
      description: "Gauges, charts, LEDs, switches, sliders, joysticks, colour and time pickers, tables, logs, camera streams and maps, arranged in pages, groups and rows."
    - icon: "fas fa-tower-broadcast"
      title: "WiFi, Bluetooth, USB"
      description: "The same screen over the local network, Bluetooth LE, Bluetooth Classic or a USB OTG cable. Devices show up via mDNS, a Bluetooth scan or a plugged-in adapter."
    - icon: "fas fa-shield-halved"
      title: "PIN pairing"
      description: "A device can ask for a PIN. Pairing is a challenge-response handshake, so the PIN itself is never sent, and the session token stays in the phone's secure storage."
    - icon: "fas fa-screwdriver-wrench"
      title: "Setup and updates built in"
      description: "Every device brings its system pages: WiFi provisioning, firmware updates over the air, device info, PIN change, reboot and a serial console."
    - icon: "fas fa-eye-slash"
      title: "No cloud, no account"
      description: "The phone talks straight to the device. No server in between, no sign-up, no analytics and no ads. App, library and protocol are free software under the MIT license."

screenshots:
