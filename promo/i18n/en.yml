webapp:
  tag: "In the browser"
  title: "No app needed"
  subtitle: "A device on WiFi also serves its screen as a web page. Open its address in any browser on your network: same widgets, same PIN pairing, nothing to install."
  items:
    - icon: "fas fa-gauge-high"
      label: "The boiler controller in a desktop browser"
      image: "/assets/images/web-device-light.jpg"
    - icon: "fas fa-sliders"
      label: "Switch, slider, mode select and log in a desktop browser"
      image: "/assets/images/web-controls-light.jpg"

cta:
  title: "Get the app"
  subtitle: "For Android 7.0 and later, from the manzari.dev F-Droid repository. Add the repository in your F-Droid client, then install espFace from there. The documentation takes you from a bare ESP32 to the first screen."

