# The docs site: docs/site, a VitePress build with base /docs/. Hashed assets are immutable, pages are revalidated.
# ^~ keeps these paths away from the engine's static-asset regex location.
location ^~ /docs/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/docs-security-headers.conf;
    try_files $uri =404;
}

location ^~ /docs/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/docs-security-headers.conf;
    error_page 404 /docs/404.html;
    try_files $uri $uri/index.html $uri.html =404;
}

location = /docs {
    absolute_redirect off;
    return 301 /docs/;
}
