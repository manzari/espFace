server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { add_header Content-Type text/plain; return 200 "ok"; }

    # Versioned renderer: immutable, CORS * so the device-served bootstrap page can load it from any origin.
    location /r/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    # The docs were served here until 2026-11-20 and are part of the landing page now; old links keep working.
    location = /docs { return 301 https://espface.manzari.dev/docs/; }
    location /docs/ { return 301 https://espface.manzari.dev$request_uri; }

    # Landing page (/), connect page (/connect/) and the flash page (/flash/).
    location / {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ /index.html;
    }
}
