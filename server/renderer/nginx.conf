server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { add_header Content-Type text/plain; return 200 "ok"; }

    # Versioned renderer: immutable, CORS * so the device-served bootstrap page can load it from any origin.
    location /r/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    # Docs site (VitePress build, base /docs/); hashed assets are immutable, pages are revalidated.
    location /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /docs/ {
        add_header Cache-Control "no-cache";
        error_page 404 /docs/404.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # Landing page (/), connect page (/connect/) and the flash page (/flash/).
    location / {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ /index.html;
    }
}
