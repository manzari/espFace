services:
  renderer:
    build:
      context: ../..
      dockerfile: server/renderer/Dockerfile
    expose:
      - "80"
    environment:
      - SERVICE_FQDN_RENDERER_80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
