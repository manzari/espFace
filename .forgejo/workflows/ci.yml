# Forgejo Actions (GitHub-compatible syntax). Protocol vectors, fake device, firmware native tests, ESP32 footprint.
name: ci
on: [push, pull_request]

jobs:
  protocol:
    runs-on: docker
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - run: cd protocol && npm ci && npm test
      - run: cd tools/fake-device && npm ci && npm test

  firmware-native:
    runs-on: docker
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends gcc g++ make git && pip install platformio==6.1.16
      - run: cd firmware && pio test -e native
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd protocol && npm ci && node test/validate.mjs --d2c ../firmware/test_output/d2c.jsonl

  firmware-esp32:
    runs-on: docker
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends git && pip install platformio==6.1.16
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: cd firmware && sh tools/ci-build.sh esp32dev esp32-s3-devkitc-1
      - run: cat firmware/footprint.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with: { name: footprint, path: firmware/footprint.md }
