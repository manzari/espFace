# Forgejo Actions (GitHub-compatible syntax). Protocol vectors, fake device, firmware native tests, ESP32 footprint.
name: ci
on: [push, pull_request]

jobs:
  protocol:
    runs-on: docker
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - run: cd protocol && npm ci && npm test
      - run: cd tools/fake-device && npm ci && npm test

  firmware-native:
    runs-on: docker
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends gcc g++ make git && pip install platformio==6.1.16
      - run: cd firmware && pio test -e native
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd protocol && npm ci && node test/validate.mjs --d2c ../firmware/test_output/d2c.jsonl

  firmware-esp32:
    runs-on: docker
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends git && pip install platformio==6.1.16
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: cd firmware && sh tools/ci-build.sh esp32dev esp32-s3-devkitc-1
      - run: cat firmware/footprint.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with: { name: footprint, path: firmware/footprint.md }

  flutter:
    runs-on: docker
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cd tools/fake-device && npm ci --omit=dev
          (node src/index.mjs --port=18080 --pin=1234 > /tmp/fake.log 2>&1 &)
          (node src/index.mjs --port=18081 --pin=1234 --drop-every 8 > /tmp/fake-drop.log 2>&1 &)
          (node src/index.mjs --port=18082 --slow-ui > /tmp/fake-slow.log 2>&1 &)
          (node src/index.mjs --port=18083 --huge-ui > /tmp/fake-huge.log 2>&1 &)
          (node src/index.mjs --port=18084 --max-clients 1 > /tmp/fake-busy.log 2>&1 &)
          (node src/index.mjs --port=18085 --pin=1234 --flaky-auth > /tmp/fake-flaky.log 2>&1 &)
          sleep 2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: flutter-${{ hashFiles('apps/mobile/pubspec.lock') }}
      - run: cd apps/mobile && flutter pub get && flutter analyze && flutter test
      - run: cd apps/mobile && ESPFACE_FAKE_WS=ws://localhost:18080/ws flutter test test/integration/fake_device_test.dart
      - run: |
          cd apps/mobile && ESPFACE_FAKE_WS_DROP=ws://localhost:18081/ws ESPFACE_FAKE_WS_SLOW=ws://localhost:18082/ws \
            ESPFACE_FAKE_WS_HUGE=ws://localhost:18083/ws ESPFACE_FAKE_WS_BUSY=ws://localhost:18084/ws \
            ESPFACE_FAKE_WS_FLAKY=ws://localhost:18085/ws flutter test test/integration/hardening_test.dart
      - run: cd apps/mobile && flutter build apk --debug && ls -la build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: app-debug.apk, path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk }

  web:
    runs-on: docker
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - run: cd web && npm ci && npm run build && npm test

  docs:
    runs-on: docker
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - run: cd docs/site && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: docs-site, path: docs/site/.vitepress/dist }
