; Library development project. Unit tests run natively; ESP builds use tools/ci-build.sh (pio ci per example).
[platformio]
default_envs = native

[env:native]
platform = native
test_build_src = yes
build_flags = -std=c++17 -DESPFACE_NATIVE -Wall -Wextra -Wno-unused-parameter -Isrc -g -fsanitize=address -fno-omit-frame-pointer
build_src_filter = +<*> -<transport/WsTransport.cpp> -<sys/WifiMgr.cpp> -<sys/NvsStore.cpp> -<Face.cpp>
lib_deps = bblanchon/ArduinoJson@^7.2.0
test_framework = unity
