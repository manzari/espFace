// Vendored usb_serial 0.5.2 (MIT, https://github.com/altera2015/usbserial): only this build file was changed
// so that the plugin builds with Gradle 9 / AGP 9 (jcenter() and lintOptions are gone).
group 'dev.bessems.usbserial'
version '0.5.2'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 36

    defaultConfig {
        minSdk 23
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
