  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(24) translate(-16.5 -16.5)" fill="#fff">
    <rect x="7" y="9" width="18" height="4" rx="2"/>
