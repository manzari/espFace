name: espface
description: "espFace mobile app: native renderer for ESP32 devices speaking the espFace protocol."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  dynamic_color: 1.9.0
  file_picker: 13.1.0
  fl_chart: 1.2.0
  flutter_blue_classic: 0.1.1
  flutter_blue_plus: 1.36.8
  flutter_map: 8.3.2
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 17.5.0
  latlong2: 0.10.1
  nsd: 5.0.1
  qr_code_dart_scan: 0.14.0
  shared_preferences: 2.5.6
  usb_serial:
    path: third_party/usb_serial
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

# scripts/icons.sh renders assets/icon/*.svg and runs this.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2f7df6"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23
