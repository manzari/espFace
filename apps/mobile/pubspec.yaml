name: espface
description: "espFace mobile app: native renderer for ESP32 devices speaking the espFace protocol."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  dynamic_color: 1.9.0
  file_picker: 13.1.0
  fl_chart: 1.2.0
  flutter_map: 8.3.2
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 17.5.0
  latlong2: 0.10.1
  mobile_scanner: 7.4.2
  nsd: 5.0.1
  shared_preferences: 2.5.6
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
